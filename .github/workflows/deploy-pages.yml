name: Publish WebForge to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            webforge/package-lock.json
            tapioca-estacao-br/package-lock.json
            lima-climatizacao/package-lock.json
            lucas-construcoes/package-lock.json
      - run: npm --prefix webforge ci --no-audit --no-fund
      - run: npm --prefix tapioca-estacao-br ci --no-audit --no-fund
      - run: npm --prefix lima-climatizacao ci --no-audit --no-fund
      - run: npm --prefix lucas-construcoes ci --no-audit --no-fund
      - name: Validate and build presentations
        run: |
          npm --prefix webforge run lint
          npm --prefix tapioca-estacao-br run lint
          npm --prefix tapioca-estacao-br test
          npm --prefix lima-climatizacao run lint
          npm --prefix lima-climatizacao test
          npm --prefix lucas-construcoes run lint
          npm --prefix lucas-construcoes test
          npm --prefix webforge run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
