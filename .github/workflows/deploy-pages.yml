name: Validate WebForge (no public deployment)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            webforge/package-lock.json
            tapioca-estacao-br/package-lock.json
            lima-climatizacao/package-lock.json
      - run: npm --prefix webforge ci --no-audit --no-fund
      - run: npm --prefix tapioca-estacao-br ci --no-audit --no-fund
      - run: npm --prefix lima-climatizacao ci --no-audit --no-fund
      - name: Lint, test and build private portal
        run: |
          npm --prefix webforge run lint
          npm --prefix webforge test
          npm --prefix tapioca-estacao-br run lint
          npm --prefix tapioca-estacao-br test
          npm --prefix lima-climatizacao run lint
          npm --prefix lima-climatizacao test
          npm --prefix webforge run build
      - name: Build server container
        run: docker build -t webforge-validation .
      - name: Verify production container over HTTPS
        run: WEBFORGE_TEST_IMAGE=webforge-validation python webforge/tests/docker-smoke.py
