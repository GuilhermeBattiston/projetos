services:
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: '8080'
      APP_ORIGIN: https://${WEBFORGE_DOMAIN:?Configure WEBFORGE_DOMAIN no arquivo .env}
      TRUST_PROXY_HOPS: '1'
      DATA_DIR: /data
      SESSION_TTL_SECONDS: '3600'
    volumes:
      - webforge_data:/data
    tmpfs:
      - /tmp
    expose:
      - '8080'
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEBFORGE_DOMAIN: ${WEBFORGE_DOMAIN:?Configure WEBFORGE_DOMAIN no arquivo .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  webforge_data:
  caddy_data:
  caddy_config:
